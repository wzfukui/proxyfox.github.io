name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/submit-indexnow.sh"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs
        run: bash scripts/submit-indexnow.sh
